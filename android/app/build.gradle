apply plugin: 'com.android.application'

// The app version comes from package.json, the one place it is set. Vite
// inlines the same field into the web layer (vite.config.ts), which is what
// the in-app update check compares against, so versionName and the version
// the app believes it is can never disagree.
//
// versionCode is derived rather than kept by hand: MAJOR * 10000 + MINOR * 100
// + PATCH, so 1.2.0 is 10200. It only ever has to increase, and it does as
// long as the version does. MINOR and PATCH are capped at 99 to keep that true.
def appVersionName = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def appVersionParts = appVersionName.tokenize('.')
if (appVersionParts.size() != 3 || !appVersionParts.every { it.isInteger() }) {
    throw new GradleException("package.json \"version\" must be MAJOR.MINOR.PATCH, got '${appVersionName}'")
}
def (appMajor, appMinor, appPatch) = appVersionParts.collect { it.toInteger() }
if (appMinor > 99 || appPatch > 99) {
    throw new GradleException("package.json \"version\" MINOR and PATCH must be 99 or less, got '${appVersionName}'")
}
def appVersionCode = appMajor * 10000 + appMinor * 100 + appPatch

android {
    namespace = "com.indie.watchtime"
    compileSdk = 36  // Explicit, no root project ext
    
    defaultConfig {
        applicationId "com.indie.watchtime"
        minSdkVersion 24  // Capacitor minimum
        targetSdkVersion 35  // Required for Play Store, August 2025+
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    
    buildTypes {
        release {
            minifyEnabled = true  // **Change to true for Play Store**
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WebViewAssetLoader, used by EpisodePanelActivity to serve the built web
    // app over https://localhost - the SAME origin Capacitor serves the main
    // app from, which is what lets the widget's episode overlay share the
    // app's IndexedDB instead of talking to a copy of the data.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
