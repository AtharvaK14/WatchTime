<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so content clears
         the Android status bar / gesture area (see safe-area CSS). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <!-- Fonts are self-hosted (see public/fonts/README.md and the @font-face
         rules in src/index.css). Nothing is fetched from a font CDN, so
         typography survives being offline and no third party sees a request
         on app launch. -->
    <link rel="preload" href="/fonts/geist-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>WatchTime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
